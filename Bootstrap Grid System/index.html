<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <title>Grid System</title>
</head>

<body>
    <br>
    <h1 class="text-center fw-bold">Fruits Pricing Information</h1>
    <div class="container mt-5">
        <div class="row border p-2">
            <div class="col-sm w-auto-col mb-4 fw-bold text-primary">
                Item Name
            </div>
            <div class="col-sm w-auto-col mb-4 fw-bold text-primary">
                Quantity
            </div>
        </div>
        <!-- Row 1 -->
        <div class="row border p-2">
            <div class="col-sm-6"> Apple </div>
            <div class="col-sm-6"> 5 </div>
        </div>
        <!-- Row 2 -->
        <div class="row border p-2">
            <div class="col-sm-6"> Banana </div>
            <div class="col-sm-6"> 10 </div>
        </div>
        <!-- Row 3 -->
        <div class="row border p-2">
            <div class="col-sm-6"> Orange </div>
            <div class="col-sm-6"> 7 </div>
        </div>
        <!-- Row 4 -->
        <div class="row border p-2">
            <div class="col-sm-6"> Mango </div>
            <div class="col-sm-6"> 3 </div>
        </div>
        <!-- Row 5 -->
        <div class="row border p-2">
            <div class="col-sm-6"> Grapes </div>
            <div class="col-sm-6"> 5 </div>
        </div>
    </div>
</body>

</html>
