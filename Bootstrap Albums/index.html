<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Album</title>
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <!-- Navigation Bar -->
  <header>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="#">
          My Album
        </a>
      </div>
    </nav>
  </header>
  <!-- Album Introduction -->
  <main>
    <section class="py-5 text-center">
      <div class="container">
        <h1 class="fw-light">
          My Photo Album
        </h1>
        <p class="lead text-body-secondary">
          Welcome to my album. Here are some of my
          favorite pets.
        </p>
      </div>
    </section>
    <!-- Album Cards -->
    <div class="album py-5 bg-body-tertiary">
      <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
          <!-- Card 1 -->
          <div class="col">
            <div class="card shadow-sm">
              <img src="images/bunny.jpeg" class="card-img-top" alt="My first photo"
                style="height: 225px; object-fit: cover;">
              <div class="card-body">
                <p class="card-text">
                  It is a cute bunny.
                </p>
                <button class="btn btn-sm btn-outline-primary">
                  View
                </button>
              </div>
            </div>
          </div>
          <!-- Card 2 -->
          <div class="col">
            <div class="card shadow-sm">
              <img src="images/calf.jpg" class="card-img-top" alt="My second photo"
                style="height: 225px; object-fit: cover;">
              <div class="card-body">
                <p class="card-text">
                  This photo shows a beautiful calf.
                </p>
                <button class="btn btn-sm btn-outline-primary">
                  View
                </button>
              </div>
            </div>
          </div>
          <!-- Card 3 -->
          <div class="col">
            <div class="card shadow-sm">
              <img src="images/cat.jpg" class="card-img-top" alt="My third photo"
                style="height: 225px; object-fit: cover;">
              <div class="card-body">
                <p class="card-text">
                  This is a cute cat.
                </p>
                <button class="btn btn-sm btn-outline-primary">
                  View
                </button>
              </div>
            </div>
          </div>
          <!-- Card 4 -->
          <div class="col">
            <div class="card shadow-sm">
              <img src="images/dog.jpg" class="card-img-top" alt="My fourth photo"
                style="height: 225px; object-fit: cover;">
              <div class="card-body">
                <p class="card-text">
                  It is a cute dog.
                </p>
                <button class="btn btn-sm btn-outline-primary">
                  View
                </button>
              </div>
            </div>
          </div>
          <!-- Card 5 -->
          <div class="col">
            <div class="card shadow-sm">
              <img src="images/hen.jpg" class="card-img-top" alt="My fifth photo"
                style="height: 225px; object-fit: cover;">
              <div class="card-body">
                <p class="card-text">
                  This is a hen.
                </p>
                <button class="btn btn-sm btn-outline-primary">
                  View
                </button>
              </div>
            </div>
          </div>
          <!-- Card 6 -->
          <div class="col">
            <div class="card shadow-sm">
              <img src="images/panda.jpg" class="card-img-top" alt="My sixth photo"
                style="height: 225px; object-fit: cover;">
              <div class="card-body">
                <p class="card-text">
                  A beautiful photo that completes
                  my album collection.
                </p>
                <button class="btn btn-sm btn-outline-primary">
                  View
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <!-- Footer -->
  <footer class="py-4 bg-dark text-white text-center">
    <div class="container">
      <p class="mb-0">
        &copy; My Bootstrap Album 2026
      </p>
    </div>
  </footer>
</body>

</html>
