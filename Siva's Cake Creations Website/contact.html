<!DOCTYPE html>
<html lang="en">

<head>
    <title>CONTACT</title>
    <meta charset="UTF-8">
    <meta name="description" content="Contact Siva's Cake">
    <meta name="author" content="Padmavathi">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>

<body class="contact-page">
    <!--Navigation Section NAVBAR-->
    <nav class="nav-bar">
        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="contact.html">CONTACT US</a></li>
        </ul>
    </nav>
    <!--Header-->
    <header>
        <div>
            <h1 class="animate-text">Contact Us!</h1>
        </div>
    </header>
    <!--Form-->
    <section>
        <div>
            <h3 id="contact-h3">Please provide your contact information and a brief message of your inquiry.</h3>
        </div>
        <div>
            <form action="" method="get">
                <table>
                    <tr>
                        <td>
                            <label for="Fname">First Name</label>
                        </td>
                        <td>
                            <input type="text" placeholder="Enter First Name" name="Fname">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="Lname">Last Name</label>
                        </td>
                        <td>
                            <input type="text" placeholder="Enter Last Name" name="Lname">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="Email">Email</label>
                        </td>
                        <td>
                            <input type="email" placeholder="Enter Email" name="Email">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="Phone">Phone Number</label>
                        </td>
                        <td>
                            <input type="tel" placeholder="Enter number" name="Phone">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="Message">Message</label>
                        </td>
                        <td>
                            <textarea placeholder="Type your message here"></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input type="checkbox" id="Newsletter">
                            <label for="Newsletter">Would you like to receive our monthly newsletter?</label><br>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input type="submit" value="Submit">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </section>
    <!--Footer-->
    <footer>
        <p>Siva's Cake Creations! &copy; 2026</p>
    </footer>
</body>
</html>
